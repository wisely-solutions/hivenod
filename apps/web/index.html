    <style>
      /* The app shell skeleton: painted from the HTML alone, before any script runs, for people
         who look signed in (theme-init.js sets data-auth). React renders the same markup
         (components/AppSkeleton.tsx) until the session and the first data are in. */
      /* The skeleton sits in #hv-boot, an overlay next to React's #root, so React replacing #root
         never leaves a blank frame: main.tsx removes the overlay once the app has painted. */
      #hv-boot {
        display: none;
      }
      [data-auth] #hv-boot {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        overflow: hidden;
      }
      .hv-sk {
        display: none;
      }
      [data-auth] .hv-sk {
        display: flex;
        min-height: 100dvh;
        background: var(--canvas, #f4f5f7);
      }
      .hv-sk * {
        box-sizing: border-box;
      }
      .hv-side {
        display: none;
        width: 4rem;
        flex-shrink: 0;
        border-right: 1px solid var(--line, #e1e4ea);
        background: var(--surface, #fff);
      }
      .hv-col {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
      }
      .hv-head {
        display: flex;
        height: 3rem;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
        border-bottom: 1px solid transparent;
        background: var(--surface, #fff);
      }
      .hv-main {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1rem 1rem 6rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .hv-b {
        border-radius: 7px;
        background: var(--line, #e1e4ea);
        animation: hv-sh 1.6s ease-in-out infinite;
      }
      .hv-card {
        height: 6rem;
        border-radius: 12px;
        border: 1px solid var(--line, #e1e4ea);
        background: var(--surface, #fff);
      }
      .hv-tabs {
        position: fixed;
        inset: auto 0 0 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 3.5rem;
        padding-bottom: env(safe-area-inset-bottom);
        border-top: 1px solid var(--line, #e1e4ea);
        background: var(--surface, #fff);
      }
      .hv-tabs i {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
        margin: 1rem auto 0;
        border-radius: 7px;
        background: var(--line, #e1e4ea);
      }
      @keyframes hv-sh {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hv-b {
          animation: none;
        }
      }
      @media (min-width: 640px) {
        .hv-side {
          display: block;
        }
        .hv-head,
        .hv-tabs {
          display: none;
        }
        .hv-main {
          padding: 2rem 1rem 4rem;
        }
      }
      @media (min-width: 1280px) {
        .hv-side {
          width: 16rem;
        }
      }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="hv-boot">
      <div class="hv-sk" data-skeleton aria-hidden="true">
        <div class="hv-side"></div>
        <div class="hv-col">
          <div class="hv-head">
            <div class="hv-b" style="width: 1.6rem; height: 1.6rem"></div>
            <div class="hv-b" style="width: 5rem; height: 1.5rem"></div>
          </div>
          <div class="hv-main">
            <div class="hv-b" style="width: 12rem; height: 2.25rem"></div>
            <div class="hv-card"></div>
            <div class="hv-card"></div>
            <div class="hv-card"></div>
          </div>
        </div>
        <div class="hv-tabs"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <!-- Without JavaScript: the product page's two usages as plain text (item x38DsNLjyh1rBTlkwMr5). -->
    <noscript>
      <style>
        .nojs {
          max-width: 46rem;
          margin: 0 auto;
          padding: 2.5rem 1rem 4rem;
          font:
            16px/1.55 system-ui,
            sans-serif;
          color: #15171b;
          background: #fbfaf7;
        }
        .nojs h1 {
          font-size: 2.4rem;
          line-height: 1.1;
          margin: 0 0 1rem;
        }
        .nojs h2 {
          font-size: 1.4rem;
          margin: 2rem 0 0.5rem;
        }
        .nojs code {
          display: block;
          padding: 0.6rem 0.8rem;
          border: 1px solid #e3e1da;
          border-radius: 10px;
          background: #fff;
          overflow-wrap: anywhere;
        }
        .nojs a {
          color: #8a5800;
        }
        @media (prefers-color-scheme: dark) {
          .nojs {
            color: #f3f4f6;
            background: #0b0d10;
          }
          .nojs code {
            background: #151920;
            border-color: #262b34;
          }
          .nojs a {
            color: #f5b52e;
          }
        }
      </style>
      <main class="nojs">
        <h1>Agents do the work. You make the calls.</h1>
        <p>
          Put agents like Claude Code to work on your projects, your inbox and your calendar. They
          pick up the work and stop at your gates. You decide from your desk or your phone.
        </p>
        <code>curl -fsSL https://hivenod.com/install.sh | sh</code>
        <section id="projects">
          <h2>Projects: agents build it. You approve it.</h2>
          <p>
            Every project is a process: agents shape, build, test and ship, and hand work to each
            other. Each gate that needs a person waits for you.
          </p>
        </section>
        <section id="inbox">
          <h2>Inbox and Calendar: agents answer it. You OK it.</h2>
          <p>
            Your agents read every request, rank it, draft the reply and find a time in your
            calendar. Nothing is sent or booked without your OK.
          </p>
        </section>
        <p>
          Hivenod needs JavaScript to run. It is open source:
          <a href="https://github.com/wisely-solutions/hivenod"
            >github.com/wisely-solutions/hivenod</a
          >.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
