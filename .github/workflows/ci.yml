name: CI
on:
  pull_request:
  push:
    branches: [main]
# Pull requests: a new push cancels the older run of the same branch. main: every push gets its own
# group, so a burst of merges queues instead of cancelling the run that was about to go green.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  check:
    name: lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:scripts
      - run: pnpm build
      - run: pnpm size

  go:
    name: go (CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go vet ./...
        working-directory: cli
      - run: go test ./...
        working-directory: cli

  rules:
    name: rules and integration (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emulators: 'true'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: pnpm test:rules:core

  # The expression-budget probe is one file that takes about 7 minutes by itself: its own job.
  rules-headroom:
    name: rules headroom (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emulators: 'true'
      - run: pnpm test:rules:headroom

  e2e:
    name: e2e (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emulators: 'true'
          browser: 'true'
      - name: E2E (against the auth + firestore emulators)
        run: pnpm e2e:emu --shard=${{ matrix.shard }}/6
        env:
          CI: 'true'
          # Two workers per 4-CPU runner (the browsers, the emulator JVM and the preview server share it):
          # the timing specs fail when 4 workers starve each other. More shards instead of more workers.
          E2E_WORKERS: '2'
          # The 5-minute limit is for the 8-CPU VM; the hosted runner has 4 CPUs.
          E2E_BUDGET_MIN: '14'

  perf:
    name: first-load speed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          emulators: 'true'
          browser: 'true'
      - name: First-load speed on a throttled phone (numbers only, shared runners are noisy)
        run: |
          PERF_DIR="$PWD/perf-out" pnpm perf:emu
          node -e "const r=require('./perf-out/load.json');const row=(n,m)=>'| '+n+' | '+m.shell+' | '+m.heading+' | '+m.item+' | '+m.lcp+' | '+m.kb+' |';console.log('### First load, '+r.profile+'\n\n| run | shell ms | heading ms | first item ms | LCP ms | KB |\n|---|---|---|---|---|---|\n'+row('cold',r.cold)+'\n'+row('warm',r.warm)+'\n\nBudget: shell < '+r.budget.shellMs+', cold LCP < '+r.budget.coldLcpMs+', warm LCP < '+r.budget.warmLcpMs)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CI: 'true'
